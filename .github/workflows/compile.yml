name: Build ESP32-C6 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and Esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware
        run: pio run

      - name: Merge Binaries into Factory File
        run: |
          python -m esptool --chip esp32c6 merge_bin \
            -o .pio/build/esp32-c6-devkitc-1/factory.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 .pio/build/esp32-c6-devkitc-1/bootloader.bin \
            0x8000 .pio/build/esp32-c6-devkitc-1/partitions.bin \
            0x10000 .pio/build/esp32-c6-devkitc-1/firmware.bin

      - name: Upload Factory Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-factory-firmware
          path: .pio/build/esp32-c6-devkitc-1/factory.bin
