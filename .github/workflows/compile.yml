name: Build ESP32-C6 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Firmware
        run: pio run

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-binaries
          path: |
            .pio/build/esp32-c6-devkitc-1/bootloader.bin
            .pio/build/esp32-c6-devkitc-1/partitions.bin
            .pio/build/esp32-c6-devkitc-1/firmware.bin
